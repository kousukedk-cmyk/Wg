<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebP → GIF 一括変換ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- gif.js と JSZip の読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* iOS風のスムーズなスクロールとバウンス抑制 */
    html, body {
      overscroll-behavior-y: none;
    }
    /* カスタムレンジスライダー */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #007AFF;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0, 122, 255, 0.4);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #E5E7EB;
      border-radius: 999px;
    }
    .dark input[type=range]::-webkit-slider-runnable-track {
      background: #374151;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3.5">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight tracking-tight">WebP → GIF 変換</h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">iPhone完結・完全ローカル処理</p>
        </div>
      </div>
      <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
        通信ゼロ
      </span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- カスタム通知バナー（alert代替） -->
    <div id="toast-banner" class="hidden fixed bottom-6 left-4 right-4 max-w-md mx-auto z-50 bg-slate-900 dark:bg-slate-800 text-white px-4 py-3.5 rounded-2xl shadow-xl border border-slate-700/50 flex items-center justify-between transition-all duration-300 transform translate-y-2 opacity-0">
      <div class="flex items-center space-x-3">
        <span id="toast-icon" class="text-blue-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </span>
        <p id="toast-message" class="text-sm font-medium leading-snug"></p>
      </div>
      <button onclick="hideToast()" class="ml-3 text-slate-400 hover:text-white p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- アップロードエリア -->
    <section class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-800">
      <label for="file-input" id="drop-zone" class="relative flex flex-col items-center justify-center w-full py-9 px-4 border-2 border-dashed border-blue-300 dark:border-blue-700/60 rounded-2xl bg-blue-50/50 dark:bg-blue-950/20 hover:bg-blue-50 dark:hover:bg-blue-900/30 active:scale-[0.99] transition-all cursor-pointer">
        <div class="w-14 h-14 mb-3 rounded-2xl bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 flex items-center justify-center">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
        </div>
        <p class="text-base font-bold text-slate-800 dark:text-slate-100 text-center">
          WebP画像を選択（複数可）
        </p>
        <p class="text-xs text-slate-500 dark:text-slate-400 text-center mt-1.5 leading-relaxed">
          タップして「写真ライブラリ」または「ファイル」から<br>複数のWebPを同時に選択できます
        </p>
        <span class="mt-4 inline-flex items-center px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white shadow-sm">
          画像を選ぶ
        </span>
        <!-- iPhoneの写真・ファイル両方から複数選択可能にする設定 -->
        <input id="file-input" type="file" accept="image/webp,.webp" multiple class="hidden">
      </label>

      <!-- 変換オプション設定（折りたたみ/コンパクト表示） -->
      <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">変換設定（iPhoneメモリ最適化）</span>
          <span id="anim-support-badge" class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
            解析エンジン準備中...
          </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 最大幅リサイズ（iPhoneメモリクラッシュ防止に重要） -->
          <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl">
            <div class="flex justify-between items-center mb-1.5">
              <label for="max-width-select" class="text-xs font-medium text-slate-700 dark:text-slate-300">最大横幅サイズ</label>
              <span class="text-[11px] text-blue-600 dark:text-blue-400 font-semibold">推奨: 800px以下</span>
            </div>
            <select id="max-width-select" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="0">元のサイズを維持</option>
              <option value="1080">最大 1080px</option>
              <option value="800" selected>最大 800px (高速・安定)</option>
              <option value="500">最大 500px (SNS・LINE向け)</option>
            </select>
          </div>

          <!-- 画質設定 -->
          <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl flex flex-col justify-between">
            <div class="flex justify-between items-center mb-1">
              <label for="quality-range" class="text-xs font-medium text-slate-700 dark:text-slate-300">GIF画質 / 処理速度</label>
              <span id="quality-label" class="text-xs font-bold text-blue-600 dark:text-blue-400">標準 (バランス)</span>
            </div>
            <input id="quality-range" type="range" min="1" max="20" value="10" class="w-full my-2">
            <div class="flex justify-between text-[10px] text-slate-400">
              <span>高画質(低速)</span>
              <span>軽量(高速)</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 全体アクション＆進捗バー（ファイル選択後に表示） -->
    <section id="batch-controls" class="hidden bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-800 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-bold text-slate-800 dark:text-slate-100">
            変換リスト (<span id="completed-count">0</span> / <span id="total-count">0</span> 完了)
          </h2>
          <p id="overall-status-text" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">待機中...</p>
        </div>
        <button id="clear-all-btn" class="text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 px-3 py-1.5 rounded-xl transition-colors">
          すべてクリア
        </button>
      </div>

      <!-- 全体プログレスバー -->
      <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-2.5 overflow-hidden">
        <div id="overall-progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- 一括ダウンロードボタン -->
      <div class="pt-1 flex flex-col sm:flex-row gap-2.5">
        <button id="download-zip-btn" disabled class="flex-1 flex items-center justify-center space-x-2 py-3.5 px-4 rounded-2xl font-bold text-sm text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 dark:disabled:bg-slate-800 disabled:text-slate-500 shadow-sm active:scale-[0.98] transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          <span>すべてZIPで一括保存</span>
        </button>
      </div>
      <p class="text-[11px] text-slate-400 dark:text-slate-500 text-center">
        ※iPhoneの「写真」アプリに保存したい場合は、各画像の「保存」ボタンから画像を長押し→「"写真"に保存」が便利です。
      </p>
    </section>

    <!-- 個別ファイルリスト -->
    <section id="file-list" class="space-y-3 pb-10">
      <!-- JavaScriptで動的にカードを追加 -->
    </section>

  </main>

  <!-- プレビューモーダル（iPhoneでの長押し保存用にも最適） -->
  <div id="preview-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closePreviewModal(event)">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-800" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 id="modal-filename" class="text-sm font-bold truncate pr-4">image.gif</h3>
        <button onclick="closePreviewModal()" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="bg-slate-100 dark:bg-slate-950 rounded-2xl p-2 flex items-center justify-center min-h-[200px] max-h-[60vh] overflow-hidden">
        <img id="modal-img" src="" alt="GIF Preview" class="max-w-full max-h-[55vh] rounded-xl object-contain">
      </div>
      <div class="bg-blue-50 dark:bg-blue-950/40 p-3 rounded-2xl text-xs text-blue-800 dark:text-blue-200 leading-relaxed">
        <strong>iPhoneでの保存ヒント：</strong><br>
        上のGIF画像を<strong>長押し</strong>して「"写真"に保存」を選ぶと、カメラロールに直接アニメーションGIFとして保存できます。
      </div>
      <div class="flex gap-2">
        <a id="modal-download-link" href="#" download="image.gif" class="flex-1 py-3 px-4 bg-blue-600 text-white text-center text-sm font-bold rounded-2xl shadow-sm active:scale-[0.98] transition-transform">
          ファイルとしてダウンロード
        </a>
      </div>
    </div>
  </div>

  <script>
    /**
     * WebP -> GIF 完全クライアントサイド変換エンジン
     * 1. Cross-Origin制約を回避するため gif.worker.js をBlob URLとして動的生成
     * 2. WebCodecs API (ImageDecoder) が利用可能なiOS Safari 16.4+等ではアニメーションWebPの全フレームを抽出してGIF化
     * 3. 非対応環境や静止画WebPの場合は HTML5 Canvas で高速レンダリングしてGIF化
     */

    // 状態管理
    const state = {
      items: [], // { id, file, name, status, progress, gifBlob, gifUrl, isAnimated, frameCount, sizeText, error }
      isProcessing: false,
      workerBlobUrl: null,
      supportsImageDecoder: ('ImageDecoder' in window)
    };

    // DOM要素の参照
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const maxWidthSelect = document.getElementById('max-width-select');
    const qualityRange = document.getElementById('quality-range');
    const qualityLabel = document.getElementById('quality-label');
    const animSupportBadge = document.getElementById('anim-support-badge');
    const batchControls = document.getElementById('batch-controls');
    const fileListEl = document.getElementById('file-list');
    const completedCountEl = document.getElementById('completed-count');
    const totalCountEl = document.getElementById('total-count');
    const overallStatusText = document.getElementById('overall-status-text');
    const overallProgressBar = document.getElementById('overall-progress-bar');
    const downloadZipBtn = document.getElementById('download-zip-btn');
    const clearAllBtn = document.getElementById('clear-all-btn');

    // 初期化処理
    async function initApp() {
      // アニメーションWebP対応状況の表示
      if (state.supportsImageDecoder) {
        animSupportBadge.textContent = '✨ アニメーションWebP対応';
        animSupportBadge.className = 'text-[11px] px-2.5 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 font-medium';
      } else {
        animSupportBadge.textContent = '静止画WebP変換モード';
      }

      // gif.js の Web Worker スクリプトを同一オリジンBlobとして事前取得（iOS SafariでのWorker制限回避）
      try {
        const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
        if (!response.ok) throw new Error('Worker fetch failed');
        const workerCode = await response.text();
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        state.workerBlobUrl = URL.createObjectURL(blob);
      } catch (err) {
        console.error('Worker初期化エラー:', err);
        showToast('変換エンジンの読み込みに失敗しました。ネット接続を確認してください。', 'error');
      }
    }

    // トースト通知制御（alertの代替）
    let toastTimer = null;
    function showToast(message, type = 'info') {
      const banner = document.getElementById('toast-banner');
      const msgEl = document.getElementById('toast-message');
      const iconEl = document.getElementById('toast-icon');

      msgEl.textContent = message;
      if (type === 'error') {
        iconEl.innerHTML = '<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
      } else if (type === 'success') {
        iconEl.innerHTML = '<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
      } else {
        iconEl.innerHTML = '<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
      }

      banner.classList.remove('hidden');
      requestAnimationFrame(() => {
        banner.classList.remove('translate-y-2', 'opacity-0');
      });

      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 4000);
    }

    function hideToast() {
      const banner = document.getElementById('toast-banner');
      banner.classList.add('translate-y-2', 'opacity-0');
      setTimeout(() => banner.classList.add('hidden'), 300);
    }

    // 画質スライダーの表示更新
    qualityRange.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      if (val <= 5) qualityLabel.textContent = '最高画質 (低速)';
      else if (val <= 12) qualityLabel.textContent = '標準 (バランス)';
      else qualityLabel.textContent = '軽量優先 (高速)';
    });

    // ファイル選択イベント
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFiles(Array.from(e.target.files));
        fileInput.value = ''; // 同じファイルを再選択できるようにリセット
      }
    });

    // ドラッグ＆ドロップ対応（iPadやPC向け）
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-blue-500', 'bg-blue-100/60', 'dark:bg-blue-900/40');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-blue-500', 'bg-blue-100/60', 'dark:bg-blue-900/40');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500', 'bg-blue-100/60', 'dark:bg-blue-900/40');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFiles(Array.from(e.dataTransfer.files));
      }
    });

    // すべてクリアボタン
    clearAllBtn.addEventListener('click', () => {
      if (state.isProcessing) {
        showToast('変換処理中はクリアできません。完了までお待ちください。', 'error');
        return;
      }
      // メモリ解放（ObjectURLの破棄）
      state.items.forEach(item => {
        if (item.gifUrl) URL.revokeObjectURL(item.gifUrl);
        if (item.thumbUrl) URL.revokeObjectURL(item.thumbUrl);
      });
      state.items = [];
      fileListEl.innerHTML = '';
      batchControls.classList.add('hidden');
      showToast('リストをクリアしました');
    });

    // ZIP一括ダウンロード処理
    downloadZipBtn.addEventListener('click', async () => {
      const completedItems = state.items.filter(item => item.status === 'done' && item.gifBlob);
      if (completedItems.length === 0) return;

      const originalText = downloadZipBtn.innerHTML;
      downloadZipBtn.disabled = true;
      downloadZipBtn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>ZIP圧縮中...</span>
      `;

      try {
        const zip = new JSZip();
        const usedNames = new Set();

        completedItems.forEach((item) => {
          // 重複ファイル名の回避
          let fileName = item.gifName;
          let counter = 1;
          while (usedNames.has(fileName)) {
            const base = item.gifName.replace(/\.gif$/i, '');
            fileName = `${base}_${counter}.gif`;
            counter++;
          }
          usedNames.add(fileName);
          zip.file(fileName, item.gifBlob);
        });

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const zipUrl = URL.createObjectURL(zipBlob);
        const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        
        const a = document.createElement('a');
        a.href = zipUrl;
        a.download = `converted_gifs_${timestamp}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(() => URL.revokeObjectURL(zipUrl), 10000);
        showToast(`${completedItems.length}個のGIFをZIPにまとめました！`, 'success');
      } catch (err) {
        console.error('ZIP生成エラー:', err);
        showToast('ZIPファイルの作成に失敗しました。', 'error');
      } finally {
        downloadZipBtn.disabled = false;
        downloadZipBtn.innerHTML = originalText;
      }
    });

    // ファイル追加処理
    function handleFiles(files) {
      const validFiles = files.filter(f => f.type === 'image/webp' || f.name.toLowerCase().endsWith('.webp'));
      
      if (validFiles.length === 0) {
        showToast('WebP形式の画像を選択してください。', 'error');
        return;
      }

      if (validFiles.length < files.length) {
        showToast(`${files.length - validFiles.length}個の非WebPファイルをスキップしました。`);
      }

      batchControls.classList.remove('hidden');

      validFiles.forEach(file => {
        const id = 'item_' + Math.random().toString(36).substring(2, 10);
        const baseName = file.name.replace(/\.webp$/i, '') || 'image';
        const item = {
          id,
          file,
          originalName: file.name,
          gifName: `${baseName}.gif`,
          thumbUrl: URL.createObjectURL(file),
          status: 'queued', // queued | processing | done | error
          progress: 0,
          gifBlob: null,
          gifUrl: null,
          isAnimated: false,
          frameCount: 1,
          sizeText: formatBytes(file.size),
          error: null
        };
        state.items.push(item);
        renderItemCard(item);
      });

      updateOverallProgress();
      processQueue();
    }

    // キューを順番に処理（iPhoneのメモリ不足を防ぐため1ファイルずつ直列実行）
    async function processQueue() {
      if (state.isProcessing) return;
      state.isProcessing = true;

      while (true) {
        const nextItem = state.items.find(i => i.status === 'queued');
        if (!nextItem) break;

        nextItem.status = 'processing';
        nextItem.progress = 5;
        updateItemCard(nextItem);
        updateOverallProgress();

        try {
          await convertSingleWebpToGif(nextItem);
          nextItem.status = 'done';
          nextItem.progress = 100;
        } catch (err) {
          console.error(`変換エラー (${nextItem.originalName}):`, err);
          nextItem.status = 'error';
          nextItem.error = err.message || '変換に失敗しました';
        }

        updateItemCard(nextItem);
        updateOverallProgress();

        // iPhone Safariのガベージコレクションを促すための短い待機
        await new Promise(r => setTimeout(r, 150));
      }

      state.isProcessing = false;
      updateOverallProgress();
    }

    // 単一WebPをGIFに変換するコアロジック
    async function convertSingleWebpToGif(item) {
      if (!state.workerBlobUrl) {
        throw new Error('変換ワーカーが初期化されていません');
      }

      const maxWidth = parseInt(maxWidthSelect.value, 10);
      const quality = parseInt(qualityRange.value, 10);

      // ImageDecoderが利用可能な場合、アニメーションWebPかどうかを判定してフレーム抽出を試みる
      if (state.supportsImageDecoder) {
        try {
          const arrayBuffer = await item.file.arrayBuffer();
          const isSupported = await ImageDecoder.isTypeSupported('image/webp');
          
          if (isSupported) {
            const decoder = new ImageDecoder({ data: arrayBuffer, type: 'image/webp' });
            await decoder.tracks.ready;
            const track = decoder.tracks.selectedTrack;
            const frameCount = track ? track.frameCount : 1;

            if (frameCount > 1) {
              item.isAnimated = true;
              item.frameCount = frameCount;
              updateItemCard(item);
              await encodeAnimatedWebpWithDecoder(item, decoder, frameCount, maxWidth, quality);
              decoder.close();
              return;
            }
            decoder.close();
          }
        } catch (decoderErr) {
          // ImageDecoderで失敗した場合は通常の静止画Canvasフォールバックへ進む
          console.warn('ImageDecoderフォールバック:', decoderErr);
        }
      }

      // 静止画WebP（またはImageDecoder非対応環境）の変換処理
      item.isAnimated = false;
      item.frameCount = 1;
      await encodeStaticWebpWithCanvas(item, maxWidth, quality);
    }

    // アニメーションWebPの全フレームを抽出してGIF化
    async function encodeAnimatedWebpWithDecoder(item, decoder, frameCount, maxWidth, quality) {
      // 最初のフレームでサイズを決定
      const firstResult = await decoder.decode({ frameIndex: 0 });
      const origW = firstResult.image.displayWidth;
      const origH = firstResult.image.displayHeight;
      const { width, height } = calculateDimensions(origW, origH, maxWidth);
      firstResult.image.close();

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      const gif = new GIF({
        workers: 2,
        quality: quality,
        width: width,
        height: height,
        workerScript: state.workerBlobUrl,
        transparent: 0x00000000
      });

      // 各フレームをデコードしてGIFに追加
      // iPhoneメモリ保護のため、極端にフレームが多い場合は上限を設ける（最大150フレーム）
      const maxFrames = Math.min(frameCount, 150);

      for (let i = 0; i < maxFrames; i++) {
        const result = await decoder.decode({ frameIndex: i });
        const frame = result.image;
        
        // durationはマイクロ秒単位なのでミリ秒に変換（デフォルト100ms）
        let delayMs = frame.duration ? Math.round(frame.duration / 1000) : 100;
        if (delayMs < 20) delayMs = 20; // GIF仕様の最小ディレイ制限

        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(frame, 0, 0, width, height);
        gif.addFrame(ctx, { copy: true, delay: delayMs });

        frame.close(); // ビデオフレームのメモリを即座に解放

        // 進捗の5%〜50%をフレーム抽出に割り当て
        item.progress = 5 + Math.round((i / maxFrames) * 45);
        updateItemCardProgress(item.id, item.progress);
      }

      // GIFレンダリング実行（50%〜100%）
      await renderGifAsync(gif, item, 50);
    }

    // 静止画WebPをCanvas経由でGIF化
    async function encodeStaticWebpWithCanvas(item, maxWidth, quality) {
      const img = await loadImage(item.thumbUrl);
      const { width, height } = calculateDimensions(img.naturalWidth, img.naturalHeight, maxWidth);

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, width, height);

      item.progress = 30;
      updateItemCardProgress(item.id, item.progress);

      const gif = new GIF({
        workers: 2,
        quality: quality,
        width: width,
        height: height,
        workerScript: state.workerBlobUrl
      });

      gif.addFrame(ctx, { copy: true, delay: 100 });
      await renderGifAsync(gif, item, 30);
    }

    // gif.js のレンダリングをPromise化
    function renderGifAsync(gif, item, startProgress) {
      return new Promise((resolve, reject) => {
        gif.on('progress', (p) => {
          const current = startProgress + Math.round(p * (100 - startProgress));
          item.progress = Math.min(current, 99);
          updateItemCardProgress(item.id, item.progress);
        });

        gif.on('finished', (blob) => {
          item.gifBlob = blob;
          item.gifUrl = URL.createObjectURL(blob);
          item.gifSizeText = formatBytes(blob.size);
          resolve();
        });

        try {
          gif.render();
        } catch (err) {
          reject(err);
        }
      });
    }

    // アスペクト比を維持したリサイズ計算
    function calculateDimensions(origW, origH, maxWidth) {
      if (!maxWidth || origW <= maxWidth) {
        return { width: origW, height: origH };
      }
      const ratio = maxWidth / origW;
      return {
        width: maxWidth,
        height: Math.round(origH * ratio)
      };
    }

    // 画像読み込みPromise
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        img.src = url;
      });
    }

    // バイト数フォーマット
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // 個別カードの新規描画
    function renderItemCard(item) {
      const card = document.createElement('div');
      card.id = item.id;
      card.className = 'bg-white dark:bg-slate-900 rounded-2xl p-3.5 shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center space-x-3.5 transition-all';
      card.innerHTML = getCardInnerHtml(item);
      fileListEl.appendChild(card);
    }

    // 個別カードの全体更新
    function updateItemCard(item) {
      const card = document.getElementById(item.id);
      if (card) {
        card.innerHTML = getCardInnerHtml(item);
      }
    }

    // 個別カードのプログレスバーのみ高速更新
    function updateItemCardProgress(itemId, progress) {
      const bar = document.getElementById(`${itemId}_bar`);
      const pct = document.getElementById(`${itemId}_pct`);
      if (bar) bar.style.width = `${progress}%`;
      if (pct) pct.textContent = `${progress}%`;
    }

    // カード内部のHTML生成
    function getCardInnerHtml(item) {
      const previewSrc = item.gifUrl || item.thumbUrl;
      
      let statusBadge = '';
      let actionHtml = '';

      if (item.status === 'queued') {
        statusBadge = `<span class="text-[11px] font-medium text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md">順番待ち</span>`;
      } else if (item.status === 'processing') {
        statusBadge = `
          <span class="text-[11px] font-semibold text-blue-600 dark:text-blue-400 flex items-center">
            <svg class="animate-spin -ml-0.5 mr-1.5 h-3 w-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            変換中 <span id="${item.id}_pct" class="ml-1">${item.progress}%</span>
          </span>`;
      } else if (item.status === 'done') {
        const animTag = item.isAnimated 
          ? `<span class="text-[10px] font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-1.5 py-0.5 rounded">アニメ(${item.frameCount}コマ)</span>`
          : `<span class="text-[10px] font-medium text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-1.5 py-0.5 rounded">GIF完了</span>`;
        
        statusBadge = `
          <div class="flex items-center space-x-1.5">
            ${animTag}
            <span class="text-[11px] text-slate-400">${item.sizeText} → <strong class="text-slate-600 dark:text-slate-300">${item.gifSizeText}</strong></span>
          </div>`;

        actionHtml = `
          <div class="flex items-center space-x-1.5 shrink-0">
            <button onclick="openPreviewModal('${item.id}')" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 active:scale-95 transition-all" title="プレビュー / 長押し保存">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
            <a href="${item.gifUrl}" download="${item.gifName}" class="flex items-center space-x-1 py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm active:scale-95 transition-all">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              <span>保存</span>
            </a>
          </div>`;
      } else if (item.status === 'error') {
        statusBadge = `<span class="text-[11px] font-medium text-rose-600 dark:text-rose-400">${item.error}</span>`;
      }

      const progressBarHtml = item.status === 'processing' 
        ? `<div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-1.5 mt-2 overflow-hidden">
             <div id="${item.id}_bar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-150" style="width: ${item.progress}%"></div>
           </div>`
        : '';

      return `
        <div class="w-14 h-14 rounded-xl bg-slate-100 dark:bg-slate-800 overflow-hidden shrink-0 border border-slate-200/50 dark:border-slate-700/50 cursor-pointer" onclick="${item.status === 'done' ? `openPreviewModal('${item.id}')` : ''}">
          <img src="${previewSrc}" alt="thumb" class="w-full h-full object-cover">
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold text-slate-800 dark:text-slate-100 truncate">${item.gifName}</p>
          <div class="mt-1">${statusBadge}</div>
          ${progressBarHtml}
        </div>
        ${actionHtml}
      `;
    }

    // 全体の進捗状況更新
    function updateOverallProgress() {
      const total = state.items.length;
      const completed = state.items.filter(i => i.status === 'done').length;
      const errored = state.items.filter(i => i.status === 'error').length;
      const finished = completed + errored;

      totalCountEl.textContent = total;
      completedCountEl.textContent = completed;

      const pct = total === 0 ? 0 : Math.round((finished / total) * 100);
      overallProgressBar.style.width = `${pct}%`;

      if (state.isProcessing) {
        overallStatusText.textContent = `変換処理を実行中... (${finished + 1} / ${total} 枚目)`;
        downloadZipBtn.disabled = true;
      } else if (total > 0 && finished === total) {
        overallStatusText.textContent = `すべての変換が完了しました！`;
        downloadZipBtn.disabled = completed === 0;
      } else {
        overallStatusText.textContent = '待機中...';
      }
    }

    // プレビューモーダルを開く（iPhoneでの長押し保存用）
    function openPreviewModal(itemId) {
      const item = state.items.find(i => i.id === itemId);
      if (!item || !item.gifUrl) return;

      document.getElementById('modal-filename').textContent = item.gifName;
      document.getElementById('modal-img').src = item.gifUrl;
      const dlLink = document.getElementById('modal-download-link');
      dlLink.href = item.gifUrl;
      dlLink.download = item.gifName;

      document.getElementById('preview-modal').classList.remove('hidden');
    }

    // プレビューモーダルを閉じる
    function closePreviewModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('preview-modal').classList.add('hidden');
      document.getElementById('modal-img').src = '';
    }

    // アプリ起動
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
